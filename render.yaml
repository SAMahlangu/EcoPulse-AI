services:
  - type: web
    name: ecopulse-api
    branch: main
    autoDeployTrigger: commit
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: ECOPULSE_LOCAL_DEMO
        value: "false"
      - key: ECOPULSE_LOCAL_PASSWORD_SIGNUP
        value: "false"
      - key: YOLO_MODEL_PATH
        value: models/best.pt
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_USE_SSL
        sync: false
      - key: SMTP_TIMEOUT_SECONDS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: CORS_ORIGINS
        value: "https://ecopulseaifnb.netlify.app"
      - key: APP_PUBLIC_URL
        value: "https://ecopulseaifnb.netlify.app"
